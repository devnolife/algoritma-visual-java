name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # JDK asli untuk uji diferensial (keluaran Java Mini harus identik dengan javac/java 21).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm cek-konten
      - run: pnpm uji:diferensial
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-playwright
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
